#lms{position:fixed;inset:0;z-index:99999;overflow:auto;background:#F4F5FA;color:#1F2937;font-size:14px;--p:#5B4A9B;--pd:#4A3B82;--g:#2EA84F;--y:#FFC107;--r:#F28B82}

function typer(){
  clearInterval(TWT);const el=$('#tw');if(!el)return;
  let ps=[];try{ps=JSON.parse(el.dataset.p||'[]')}catch(e){}
  if(!ps.length)return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=ps[0];return}
  let i=0,j=0,del=false,hold=0;
  TWT=setInterval(()=>{const e=$('#tw');if(!e){clearInterval(TWT);return}
    const t=ps[i];if(hold>0){hold--;return}
    if(!del){j++;e.textContent=t.slice(0,j);if(j>=t.length){del=true;hold=24}}

function pv(box,u){
  u=(u||'').trim();
  if(!u){box.innerHTML='<small>Pratinjau foto tampil di sini</small>';return}
  if(/drive\.google\.com\/drive\/folders/.test(u)){box.innerHTML='<small class="bad">Ini link folder. Gunakan link satu file gambar.</small>';return}
  if(!/^https?:\/\//.test(u)){box.innerHTML='<small class="bad">Link harus diawali https://</small>';return}
  box.innerHTML=imgTag(u)+'<small>Memuat foto...</small>';
  const im=box.querySelector('img'),sm=box.querySelector('small');
  im.onload=()=>{sm.textContent='Foto terbaca';sm.className='okk'};
}

  <div class="ff"><button class="btn gy" id="mc">Batal</button><button class="btn" id="ms">${ic('check',16)}Simpan</button></div></div>`;
  $('#lms').append(o);
  $('#mc',o).onclick=()=>o.remove();$('#mx',o).onclick=()=>o.remove();
  o.querySelectorAll('select[data-cat]').forEach(se=>se.addEventListener('change',()=>{const n=$('#'+se.id+'_new',o);n.style.display=se.value==='__new'?'':'none';if(se.value==='__new')n.focus()}));
  const fi=$('#f_foto',o);if(fi){const bx=$('#fp',o);pv(bx,fi.value);fi.addEventListener('input',()=>{clearTimeout(fi._t);fi._t=setTimeout(()=>pv(bx,fi.value),400)})}
  const sb=$('#ms',o);
  sb.onclick=async()=>{const d={};fields.forEach(f=>{let v=$('#f_'+f.k,o).value.trim();if(f.t==='cat'&&v==='__new'){v=$('#f_'+f.k+'_new',o).value.trim();const ex=(f.o||[]).find(c=>c.toLowerCase()===v.toLowerCase());if(ex)v=ex}d[f.k]=v});sb.disabled=true;try{await save(d);o.remove()}catch(e){sb.disabled=false;toast(e.message)}};
}
function ask(title,msg,name,ok='Ya, hapus',icn='trash'){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov qa';
    o.innerHTML=`<div class="md card qd" role="alertdialog" aria-modal="true" aria-labelledby="qt"><div class="qi">${ic(icn,28)}</div><h3 id="qt">${esc(title)}</h3>${name?`<span class="qm">${esc(name)}</span>`:''}<p>${esc(msg)}</p><div class="qb"><button class="btn gy" id="qn">Batal</button><button class="btn rd" id="qy">${ic(icn,15)}${esc(ok)}</button></div></div>`;
    $('#lms').append(o);
    const kd=e=>{if(e.key==='Escape')end(false)};
    const end=v=>{document.removeEventListener('keydown',kd);o.classList.add('out');setTimeout(()=>o.remove(),180);res(v)};
    document.addEventListener('keydown',kd);
    $('#qn',o).onclick=()=>end(false);$('#qy',o).onclick=()=>end(true);
    o.addEventListener('click',e=>{if(e.target===o)end(false)});
    $('#qn',o).focus();
  });
}

  else{const un=d.username.toLowerCase();if(!/^[a-z0-9._]{3,}$/.test(un))throw new Error('Username minimal 3 karakter huruf kecil atau angka');
    if(d.password.length<6)throw new Error('Password minimal 6 karakter');if(S.users.some(u=>u.username===un))throw new Error('Username sudah dipakai');

const act={
  nav:id=>{S.page=id;S.q='';S.cf={materi:'',tools:''};render()},
  hs:id=>{const e=$('#hero .'+id);if(!e)return;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')},
  fs(){const d=document,e=d.documentElement,m='Layar penuh ditolak di sini. Gunakan tombol Buka di tab baru.';if(d.fullscreenElement){d.exitFullscreen();return}if(!e.requestFullscreen){toast(m);return}e.requestFullscreen().catch(()=>toast(m))},
  ext(){const w=window.open(location.href,'_blank');if(!w)toast('Pop up diblokir. Izinkan pop up lalu coba lagi.')},
  rf:id=>{rf=id;$('#recw').innerHTML=recBlock()},
  rec:id=>{const [k,i]=id.split(':');k==='m'?act.open(i):act.nav('tools')},
  cat:id=>{S.page=S.dt==='tools'?'tools':'materi';S.q='';S.cf[S.page]=decodeURIComponent(id);render()},
  catm:id=>{S.page='materi';S.q='';S.cf.materi=decodeURIComponent(id);render()},
  cf:id=>{S.cf[S.page==='tools'?'tools':'materi']=decodeURIComponent(id);$('#pg').innerHTML=page()},
  dt:id=>{S.dt=id;$('#dn').innerHTML=donut();$('#dn').closest('.card').querySelectorAll('[data-a="dt"]').forEach(a=>a.classList.toggle('on',a.dataset.id===id));fx()},
  next:()=>{const m=S.materi.find(x=>!isDone(x.id))||S.materi[0];m?act.open(m.id):act.nav('materi')},
  tab:id=>{S.lt=id;S.err='';render()},
  async login(){
    const u=$('#lu').value.trim(),p=$('#lp').value;S.err='';
    try{
      if(!u||!p)throw new Error('Isi semua kolom');
      if(S.lt==='admin'){
        if(IS_PREVIEW){if(u!==DEMO_ADMIN||p!=='admin123')throw new Error('Email atau password salah')}
        else{try{await fb.signInWithEmailAndPassword(fb.auth,u,p)}catch(e){throw new Error('Login admin gagal. Periksa email dan password.')}}
        S.user={id:'admin',nama:u.split('@')[0]};S.role='admin';
      }else{
        const un=u.toLowerCase(),h=await sha(un+':'+p);let m;
        if(IS_PREVIEW)m=mem.users.find(x=>x.username===un);
        else{const s=await fb.getDocs(fb.query(fb.collection(fb.db,'users'),fb.where('username','==',un)));m=s.docs.map(d=>({id:d.id,...d.data()}))[0]}
        if(!m||m.passwordHash!==h||m.aktif===false)throw new Error('Username atau password salah, atau akun nonaktif');
        S.user=m;S.role='member';
      }
      await loadAll();S.page='dash';render();
    }catch(e){S.user=null;S.err=e.message;render()}
  },
  async logout(){if(!await ask('Keluar dari akun?','Anda akan keluar dan perlu masuk lagi untuk melanjutkan.',null,'Ya, keluar','power'))return;if(!IS_PREVIEW&&S.role==='admin')await fb.signOut(fb.auth);S.user=null;S.role=null;S.err='';S.sbDone=false;NAVY=null;render()},
  addMateri:()=>mform(),
  async pinMateri(id){const x=S.materi.find(m=>m.id===id);await DB.set('materi',id,{pin:!x.pin});await refresh();toast(x.pin?'Sematan dilepas':'Materi disematkan')},editMateri:id=>mform(S.materi.find(x=>x.id===id)),
  async delMateri(id){if(await ask('Hapus materi?','Materi ini akan dihapus permanen dan tidak bisa dikembalikan.',(S.materi.find(x=>x.id===id)||{}).judul)){await DB.del('materi',id);await refresh()}},
  addTool:()=>tform(),
  async pinTool(id){const x=S.tools.find(m=>m.id===id);await DB.set('tools',id,{pin:!x.pin});await refresh();toast(x.pin?'Sematan dilepas':'Tools disematkan')},editTool:id=>tform(S.tools.find(x=>x.id===id)),
  async delTool(id){if(await ask('Hapus tools?','Tools ini akan dihapus permanen dan tidak bisa dikembalikan.',(S.tools.find(x=>x.id===id)||{}).nama)){await DB.del('tools',id);await refresh()}},
  addUser:()=>uform(),editUser:id=>uform(S.users.find(x=>x.id===id)),
  async delUser(id){if(await ask('Hapus member?','Akun beserta password tersimpannya akan dihapus permanen. Member tidak bisa masuk lagi.',(S.users.find(x=>x.id===id)||{}).nama)){await DB.del('users',id);await DB.del('kredensial',id);await refresh()}},
  eye:id=>{S.show[id]=!S.show[id];$('#pg').innerHTML=page()},
  async cp(id){await navigator.clipboard.writeText((S.kred.find(k=>k.id===id)||{}).password||'');toast('Password disalin')},
  mail(id){const u=S.users.find(x=>x.id===id),p=(S.kred.find(k=>k.id===id)||{}).password;const b=`Halo ${u.nama},\n\nBerikut akses belajar Anda.\nUsername: ${u.username}\n${p?'Password: '+p+'\n':''}\nSilakan masuk sebagai Member di ${location.href.split('#')[0]}\n\nSimpan data ini dengan aman.`;location.href=`mailto:${u.email}?subject=${encodeURIComponent('Akses belajar '+(S.cfg.nama||'EduLearn'))}&body=${encodeURIComponent(b)}`},
  open(id){
    const m=S.materi.find(x=>x.id===id),o=document.createElement('div');o.className='ov';
    const dn=!admin()&&isDone(id);
    o.innerHTML=`<div class="md wide card"><div class="hd"><h3>${esc(m.judul)}</h3><button class="ib" id="mc">${ic('x',15)}</button></div>
    <iframe src="${esc(embed(m))}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe><p style="color:#4B5563;font-size:13px">${esc(m.deskripsi)}</p>
    ${!admin()?`<button class="btn" id="md">${ic('check',16)}${dn?'Batalkan tanda selesai':'Tandai selesai'}</button>`:''}</div>`;
    $('#lms').append(o);$('#mc',o).onclick=()=>{o.remove()};
    const b=$('#md',o);if(b)b.onclick=async()=>{await DB.set('progres',S.user.id+'_'+id,{userId:S.user.id,materiId:id,selesai:!dn,waktu:Date.now()});o.remove();await refresh()};
  },
  async savePw(){
    const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<6)throw new Error('Password minimal 6 karakter');if(a!==b)throw new Error('Password tidak sama');
    if(admin()){if(!IS_PREVIEW){try{await fb.updatePassword(fb.auth.currentUser,a)}catch(e){throw new Error('Login ulang lalu coba lagi')}}}
    else await DB.set('users',S.user.id,{passwordHash:await sha(S.user.username+':'+a)});
    $('#pw1').value='';$('#pw2').value='';toast('Password diperbarui');

};
